version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - DATABASE_URL=postgresql://dizibrand_user:dizibrand_secure_password_2026@db:5432/dizibrand_prod?schema=public
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=dizibrand_production_jwt_secret_key_minimum_32_characters
      - STORAGE_PROVIDER=mock
      - EMAIL_PROVIDER=mock
      - PAYMENT_PROVIDER=mock
      - CALENDAR_PROVIDER=mock
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: dizibrand_user
      POSTGRES_PASSWORD: dizibrand_secure_password_2026
      POSTGRES_DB: dizibrand_prod
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dizibrand_user -d dizibrand_prod']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
